<section class="board-stage" [id]="'stage-' + column().id" [attr.data-stage]="column().id"
  [attr.aria-labelledby]="'stage-heading-' + column().id">
  <header class="stage-header">
    <span class="status-dot" [attr.data-status]="column().id" aria-hidden="true"></span>
    <h2 [id]="'stage-heading-' + column().id">{{ column().title }}</h2>
    <span class="stage-count">{{ column().tasks.length }}@if (store.isFiltering()) { of {{ column().totalCount }} }</span>
  </header>
  <div cdkDropList class="stage-list" [id]="'drop-' + column().id" [cdkDropListData]="column().id"
    [cdkDropListDisabled]="!store.canWrite() || store.isFiltering()" (cdkDropListDropped)="drop($event)">
    @for (task of column().tasks; track task.id) {
      <article cdkDrag class="board-card" [cdkDragData]="task.id" [cdkDragStartDelay]="dragDelay"
        [cdkDragBoundary]="dragBounds()" [attr.data-task-id]="task.id" [attr.data-bloom-row]="task.id">
        <span cdkDragHandle class="drag-handle" title="Drag task" aria-hidden="true"><app-icon name="grip" /></span>
        <app-card [task]="task" />
      </article>
    } @empty {
      <p class="stage-empty">
        {{ store.isFiltering() ? 'No matching tasks in this stage.' : 'No tasks in this stage.' }}
      </p>
    }
  </div>
</section>
